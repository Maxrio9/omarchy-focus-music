name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install offline test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mpv dbus
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: scripts/audit-catalog
      - name: Verify bundled native checksums
        run: cd libexec && sha256sum -c SHA256SUMS
  native-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare clean source builds with committed binaries
        run: scripts/verify-native
      - name: Ensure bundled files were not overwritten
        run: git diff --exit-code -- libexec
