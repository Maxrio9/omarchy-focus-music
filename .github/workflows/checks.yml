name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install offline test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mpv dbus
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: scripts/audit-catalog
      - name: Verify bundled native checksums
        run: cd libexec && sha256sum -c SHA256SUMS
      - name: Build portable native code
        run: scripts/build-native x86_64-unknown-linux-musl aarch64-unknown-linux-musl
